# Compile DzCentrex pour Android : APK (installation directe) et AAB (Play Store), signés avec la clé d'envoi.
# Secrets du dépôt : KEYSTORE_P12_BASE64, KEYSTORE_MOT_DE_PASSE, GOOGLE_SERVICES_JSON_BASE64 (optionnel :
# sans lui, l'appli est compilée sans notifications push).
name: Compiler

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature et Firebase
        env:
          KEYSTORE_P12_BASE64: ${{ secrets.KEYSTORE_P12_BASE64 }}
          KEYSTORE_MOT_DE_PASSE: ${{ secrets.KEYSTORE_MOT_DE_PASSE }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$KEYSTORE_P12_BASE64" | base64 -d > app/dzcentrex-upload.p12
          printf 'storeFile=dzcentrex-upload.p12\nstorePassword=%s\nkeyAlias=dzcentrex\nkeyPassword=%s\n' \
            "$KEYSTORE_MOT_DE_PASSE" "$KEYSTORE_MOT_DE_PASSE" > keystore.properties
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          fi

      - name: Compilation
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: dzcentrex-android
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 30
